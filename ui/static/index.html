<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qubitrade — Quantum Market Memory</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="brand">
        <span class="logo">⚛</span>
        <div>
          <h1>Qubitrade</h1>
          <p class="tagline">Quantum market memory — <span class="black-key">real</span> vs <span class="green-key">prediction</span></p>
        </div>
      </div>
      <div id="stub-badge" class="stub-badge" hidden>prediction: stub</div>
    </header>

    <!-- TOP: ticker selector -->
    <section class="tickers" id="tickers"></section>

    <!-- MIDDLE: chart -->
    <section class="chart-wrap">
      <div id="chart"></div>
      <div id="loading" class="loading" hidden>loading…</div>
    </section>

    <!-- BOTTOM: timeframe selector + controls -->
    <footer class="bottombar">
      <div class="timeframes" id="timeframes"></div>
      <div class="forecast">
        <label for="forecast">forecast <span id="forecast-val">10</span>d</label>
        <input type="range" id="forecast" min="0" max="40" value="10" />
      </div>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
