<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qubitrade — Quantum Market Memory</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="brand">
        <span class="logo">⚛</span>
        <div>
          <h1>Qubitrade</h1>
          <p class="tagline">Quantum market memory — <span class="black-key">real</span> vs <span class="green-key">prediction</span></p>
        </div>
      </div>
      <div id="stub-badge" class="stub-badge" hidden>prediction: stub</div>
    </header>

    <!-- TOP: ticker selector -->
    <section class="tickers" id="tickers"></section>

    <!-- STAT STRIP -->
    <section class="stats" id="stats"></section>

    <!-- MIDDLE: chart + analog panel -->
    <section class="main-grid">
      <div class="chart-wrap">
        <div id="chart"></div>
        <div id="skeleton" class="skeleton" hidden></div>
      </div>

      <aside class="analog-panel">
        <h2>Most similar regimes <span class="q-tag">⚛ kernel</span></h2>
        <p id="narration" class="narration"></p>
        <div id="analogs" class="analog-list"></div>
        <p id="analog-method" class="method"></p>
      </aside>
    </section>

    <!-- BOTTOM: timeframe selector + controls -->
    <footer class="bottombar">
      <div class="timeframes" id="timeframes"></div>
      <div class="model-picker">
        <label for="model">model</label>
        <select id="model"></select>
      </div>
      <div class="forecast">
        <label for="forecast">forecast <span id="forecast-val">10</span>d</label>
        <input type="range" id="forecast" min="0" max="40" value="10" />
      </div>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
